<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5bea">
<meta name="description" content="تحدي المعلومات: ٥٠٠ سؤال في ١٠ مجالات">
<title>تحدي المعلومات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#6b7385;--line:#e3dfd4;--acc:#2f5bea;--accink:#fff;--ok:#1f9d63;--okbg:#e2f6ec;--bad:#d64545;--badbg:#fde8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151c;--card:#1b202b;--ink:#eef0f6;--mute:#9aa2b5;--line:#2c3342;--acc:#6f8cff;--accink:#0e1220;--ok:#4cc790;--okbg:#17332a;--bad:#ff7a7a;--badbg:#3a1f22}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151c;--card:#1b202b;--ink:#eef0f6;--mute:#9aa2b5;--line:#2c3342;--acc:#6f8cff;--accink:#0e1220;--ok:#4cc790;--okbg:#17332a;--bad:#ff7a7a;--badbg:#3a1f22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,Tahoma,sans-serif;line-height:1.7;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:26px;margin:6px 0 2px;font-weight:800}
.sub{color:var(--mute);margin:0 0 18px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.sec h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .chip{border-radius:12px;text-align:center}
input[type=number]{font:inherit;width:90px;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;padding:13px;border-radius:14px;border:0;background:var(--acc);color:var(--accink);cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.badge{display:inline-block;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--mute)}
.q{font-size:20px;font-weight:700;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:right;font:inherit;padding:12px 14px;margin-bottom:9px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.ok{background:var(--okbg);border-color:var(--ok);font-weight:600}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
textarea{width:100%;min-height:110px;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.box{border-radius:12px;padding:10px 14px;margin:10px 0;border:1.5px solid var(--line)}
.box small{display:block;color:var(--mute)}
.box.right{background:var(--okbg);border-color:var(--ok)}
.row{display:flex;gap:10px;margin-top:10px}
.row .btn{font-size:15px}
.btn.yes{background:var(--ok);color:#fff}.btn.no{background:var(--bad);color:#fff}
.btn.dim{opacity:.35}
.big{font-size:56px;font-weight:800;text-align:center;margin:6px 0;color:var(--acc)}
.center{text-align:center}
.rev{border-top:1px solid var(--line);padding:10px 0}
.rev b{color:var(--ok)}
.hide{display:none}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.sg{grid-template-columns:1fr}}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sc .qq{font-weight:700}
.sc .a{display:none;color:var(--ok);font-weight:800;border-top:1px dashed var(--line);padding-top:8px;width:100%}
.sc.open .a{display:block}.sc.open .tap{display:none}
.sc .tap{color:var(--mute)}
.sc.one{min-height:200px;margin-bottom:12px}
.sc.one .q{margin:6px 0}
.sc.one .a{font-size:20px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:6px 16px 26px;direction:ltr}
footer span{direction:rtl;unicode-bidi:isolate}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.win{font-size:22px;font-weight:800;color:var(--ok);margin:4px 0 8px;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA={"cats": {"1": "رياضة", "2": "تاريخ", "3": "جغرافيا", "4": "أدب", "5": "معلومات عامة", "6": "تكنولوجيا", "7": "علوم", "8": "مسرح وسينما", "9": "فن وحضارة", "10": "ألغاز"}, "qs": [{"q": "من اللاعب الوحيد الذي فاز بكأس العالم كلاعب ومدرب؟", "a": "ماريو زاغالو", "c": 1, "d": ["بيليه", "دييغو مارادونا", "يوهان كرويف"]}, {"q": "من هو الملك الفرعوني الذي يعتبره المؤرخون صاحب أول معاهدة سلام مكتوبة في التاريخ مع الحيثيين؟", "a": "رمسيس الثاني", "c": 2, "d": ["تحتمس الثالث", "أمنحتب الثالث", "سيتي الأول"]}, {"q": "ما هي أكبر جزيرة في العالم ليست قارة؟", "a": "جرينلاند", "c": 3, "d": ["مدغشقر", "بورنيو", "غينيا الجديدة"]}, {"q": "من هو شاعر النيل؟", "a": "حافظ إبراهيم", "c": 4, "d": ["أحمد شوقي", "خليل مطران", "محمود سامي البارودي"]}, {"q": "ما أكبر نهر في العالم من حيث حجم المياه؟", "a": "نهر الأمازون", "c": 5, "d": ["نهر النيل", "نهر الكونغو", "نهر المسيسيبي"]}, {"q": "ما اسم الشركة المطورة لنظام أندرويد؟", "a": "Google", "c": 6, "d": ["Microsoft", "Apple", "Samsung"]}, {"q": "ما هي الوحدة المستخدمة في قياس المقاومة الكهربائية؟", "a": "الأوم", "c": 7, "d": ["الفولت", "الأمبير", "الواط"]}, {"q": "ما اسم المسرحية الكوميدية المصرية التي جسد فيها محمد صبحي شخصية \"حافظ مظهر\"؟", "a": "وجهة نظر", "c": 8, "d": ["الواد سيد الشغال", "مدرسة المشاغبين", "تخاريف"]}, {"q": "من هو الفنان الإيطالي صاحب لوحة \"العشاء الأخير\"؟", "a": "ليوناردو دافنشي", "c": 9, "d": ["ميكيلانجيلو", "رافائيل", "سلفادور دالي"]}, {"q": "والد أحمد لديه ثلاثة أبناء الأول رعد والثاني برق، فما اسم الابن الثالث؟", "a": "أحمد", "c": 10, "d": ["محمود", "علي", "عمر"]}, {"q": "ما أول منتخب أوروبي فاز بكأس العالم خارج أوروبا؟", "a": "إسبانيا", "c": 1, "d": ["ألمانيا", "البرازيل", "إيطاليا"]}, {"q": "ما هي عاصمة الدولة المصرية القديمة خلال عصر الانتقال الأول والأسرتين التاسعة والعاشرة؟", "a": "إهناسيا", "c": 2, "d": ["طيبة", "منف", "أواريس"]}, {"q": "ما هو أطول نهر في قارة أوروبا؟", "a": "نهر الفولجا", "c": 3, "d": ["نهر الدانوب", "نهر الراين", "نهر الدنيبر"]}, {"q": "من هو أمير الشعراء؟", "a": "أحمد شوقي", "c": 4, "d": ["حافظ إبراهيم", "أحمد رامي", "خليل مطران"]}, {"q": "الدولة التي تمتلك أكبر عدد من الجزر في العالم؟", "a": "السويد", "c": 5, "d": ["النرويج", "فنلندا", "إندونيسيا"]}, {"q": "ما معنى اختصار CPU؟", "a": "وحدة المعالجة المركزية", "c": 6, "d": ["وحدة الذاكرة المركزية", "وحدة معالجة الرسومات", "وحدة التحكم الرئيسية"]}, {"q": "ما هي الوحدة المستخدمة لقياس شدة الصوت؟", "a": "الديسيبل", "c": 7, "d": ["الهيرتز", "الواط", "الأوم"]}, {"q": "من هو الكاتب المسرحي الكويتي الشهير الذي ألف مسرحية \"حامي الديار\"؟", "a": "عبد الحسين عبد الرضا", "c": 8, "d": ["سعد الفرج", "طارق العلي", "خالد النفيسي"]}, {"q": "ما اسم اللوحة الشهيرة لفان جوخ التي تظهر سماء الليل المليئة بالدوامات؟", "a": "ليلة مرصعة بالنجوم", "c": 9, "d": ["عباد الشمس", "الصرخة", "زنابق الماء"]}, {"q": "كم عدد شهور السنة التي تحتوي على 28 يوماً؟", "a": "12 شهراً", "c": 10, "d": ["شهر واحد", "شهران", "6 شهور"]}, {"q": "من سجل أول هدف ذهبي في تاريخ كأس العالم؟", "a": "لوران بلان", "c": 1, "d": ["زين الدين زيدان", "ميشيل بلاتيني", "ديفيد ترزيغيه"]}, {"q": "من هو الفرعون الذي قاد حملة مجدو العسكرية الشهيرة؟", "a": "تحتمس الثالث", "c": 2, "d": ["رمسيس الثاني", "أمنحتب الثاني", "سيتي الأول"]}, {"q": "ما هي أعلى قمة جبلية في قارة أفريقيا؟", "a": "جبل كليمنجارو", "c": 3, "d": ["جبل كينيا", "جبل رونزوري", "جبل أطلس"]}, {"q": "ما اسم الرواية الشهيرة التي كتبها نجيب محفوظ وتحولت إلى فيلم سينمائي؟", "a": "بين القصرين", "c": 4, "d": ["ثرثرة فوق النيل", "اللص والكلاب", "الحرافيش"]}, {"q": "المادة التي كانت تصنع منها خيوط العمليات الجراحية قديمًا؟", "a": "الكيت جت", "c": 5, "d": ["القطن", "النايلون", "الصوف"]}, {"q": "ما هو المتصفح الذي تطوره شركة Google؟", "a": "Google Chrome", "c": 6, "d": ["Safari", "Firefox", "Microsoft Edge"]}, {"q": "ما اسم الجهاز المستخدم لقياس الضغط الجوي؟", "a": "البارومتر", "c": 7, "d": ["الترمومتر", "الهيجرومتر", "الأنيمومتر"]}, {"q": "ما هي المسرحية الغنائية اللبنانية للأخوين رحباني وفيروز التي تدور أحداثها في متجر ساعات؟", "a": "لولو", "c": 8, "d": ["بياع الخواتم", "جبال الصوان", "ناس من ور function chips(parent,items,isOn,onPick,cls){

function setup(){

  function upd(){
    const a=pool().length,n=cfg.all?a:Math.min(cfg.n,a);

  });

      box.append(tg,g);
    }else if(style==='list'){
      L.forEach((q,i)=>{const d=el('div','sec');d.append(badge(q),el('div','q',(i+1)+'. '+q.q),el('div','box right',q.a));box.append(d)});
    }else{
      const c=el('div','sec sc one');
      const nav=el('div','row');
      const pv=el('button','btn ghost','→ السابق'),nx=el('button','btn','التالي ←');
      nav.append(pv,nx);
      const render=()=>{
        const q=L[cur];c.className='sec sc one';c.replaceChildren(el('div','top',(cur+1)+' من '+L.length),badge(q),el('div','q',q.q),el('div','a',q.a),el('small','tap','اضغط على البطاقة لإظهار الإجابة'));
        pv.disabled=cur===0;nx.disabled=cur===L.length-1;
      };
      c.onclick=()=>c.classList.toggle('open');
      pv.onclick=()=>{cur--;render()};nx.onclick=()=>{cur++;render()};
      render();box.append(c,nav);
    }
  }
  draw();
  const go=el('button','btn','✅ خلصت مذاكرة، ابدأ الاختبار');go.style.marginTop='18px';go.onclick=()=>startExam(L);
  const bk=el('button','btn ghost','↩ رجوع للإعدادات');bk.style.marginTop='10px';bk.onclick=setup;
  app.append(go,bk);
}
function header(){
  const it=quiz[idx];
  const t=el('div','top');t.append(el('span',0,'سؤال '+(idx+1)+' من '+quiz.length),el('span','badge',ICON[it.q.c]+' '+CATS[it.q.c]));
  const b=el('div','bar'),i=el('i');i.style.width=(idx/quiz.length*100)+'%';b.append(i);
  app.append(t,b);
}
function nextBtn(){
  const b=el('button','btn',idx+1<quiz.length?'السؤال التالي ←':'شوف النتيجة');
  b.style.marginTop='14px';b.onclick=()=>{idx++;idx<quiz.length?show():result()};app.append(b);
}
function show(){
  clear();header();
  const it=quiz[idx],q=it.q;
  const card=el('div','sec');card.append(el('div','q',q.q));app.append(card);
  if(it.t==='mcq'){
    const wrong=sh(q.d).slice(0,3);
    const opts=sh([q.a,...wrong]);
    const btns=opts.map(o=>{const b=el('button','opt',o);card.append(b);return b});
    btns.forEach(b=>b.onclick=()=>{
      btns.forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('ok')});
      score.mcq[1]++;
      if(b.textContent===q.a)score.mcq[0]++;else{b.classList.add('bad');missed.push(q)}
      nextBtn();
    });
  }else{
    const ta=el('textarea');ta.placeholder='اكتب إجابتك هنا...';card.append(ta);
    const rv=el('button','btn','أظهر الإجابة الصحيحة');rv.style.marginTop='12px';rv.disabled=true;card.append(rv);
    ta.oninput=()=>{rv.disabled=!ta.value.trim()};
    rv.onclick=()=>{
      const mine=ta.value.trim();
      ta.replaceWith(el('div','box'));
      const mb=card.querySelector('.box');mb.append(el('small',0,'إجابتك'),el('span',0,mine));
      rv.remove();
      const cb=el('div','box right');cb.append(el('small',0,'الإجابة الصحيحة'),el('b',0,q.a));card.append(cb);
      card.append(el('div',0,'إجابتك كانت:'));
      const row=el('div','row'),y=el('button','btn yes','✓ إجابتي صحيحة'),n=el('button','btn no','✗ إجابتي خطأ');
      row.append(y,n);card.append(row);
      const pick=ok=>{
        y.disabled=n.disabled=true;(ok?n:y).classList.add('dim');
        score.txt[1]++;if(ok)score.txt[0]++;else missed.push(q);
        nextBtn();
      };
      y.onclick=()=>pick(true);n.onclick=()=>pick(false);
    };
  }
}
function celebrate(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas');cv.id='fx';document.body.append(cv);
  const x=cv.getContext('2d');const W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cols=['#f94144','#f8961e','#f9c74f','#90be6d','#43aa8b','#4d908e','#577590','#9b5de5'];
  const ps=Array.from({length:150},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,w:6+Math.random()*7,h:8+Math.random()*10,vx:-1.5+Math.random()*3,vy:2+Math.random()*4,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(t){
    const el=t-t0;x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vy+=.03;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=Math.max(0,Math.min(1,(5500-el)/1200));x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(el<5500)requestAnimationFrame(f);else cv.remove();
  })(t0);
}
function result(){
  clear();
  const c=score.mcq[0]+score.txt[0],t=score.mcq[1]+score.txt[1],p=Math.round(c/t*100);
  const s=el('div','sec center');
  const win=p>=50;
  s.append(el('h2',0,'نتيجتك'),...(win?[el('div','win','🎉 مبروك! نجحت 🎉')]:[]),el('div','big',c+' / '+t),el('div',0,p+'٪ — '+(p>=80?'ممتاز! 🔥':p>=50?'كويس، كمّل! 👍':'حاول تاني، هتبقى أحسن 💪')));
  if(score.mcq[1])s.append(el('div','sub','اختياري: '+score.mcq[0]+' / '+score.mcq[1]));
  if(score.txt[1])s.append(el('div','sub','كتابة: '+score.txt[0]+' / '+score.txt[1]));
  app.append(s);
  if(win)celebrate();
  if(missed.length){
    const r=el('div','sec');r.append(el('h2',0,'أسئلة محتاجة مراجعة'));
    missed.forEach(q=>{const d=el('div','rev');d.append(el('div',0,q.q),el('b',0,q.a));r.append(d)});
    app.append(r);
  }
  const a=el('button','btn','🔁 تحدي جديد');a.onclick=setup;app.append(a);
}
setup();
</script>
</body>
</html>
