<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5bea">
<meta name="description" content="تحدي المعلومات: ٥٠٠ سؤال في ١٠ مجالات">
<title>تحدي المعلومات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#6b7385;--line:#e3dfd4;--acc:#2f5bea;--accink:#fff;--ok:#1f9d63;--okbg:#e2f6ec;--bad:#d64545;--badbg:#fde8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151c;--card:#1b202b;--ink:#eef0f6;--mute:#9aa2b5;--line:#2c3342;--acc:#6f8cff;--accink:#0e1220;--ok:#4cc790;--okbg:#17332a;--bad:#ff7a7a;--badbg:#3a1f22}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151c;--card:#1b202b;--ink:#eef0f6;--mute:#9aa2b5;--line:#2c3342;--acc:#6f8cff;--accink:#0e1220;--ok:#4cc790;--okbg:#17332a;--bad:#ff7a7a;--badbg:#3a1f22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,Tahoma,sans-serif;line-height:1.7;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:26px;margin:6px 0 2px;font-weight:800}
.sub{color:var(--mute);margin:0 0 18px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.sec h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .chip{border-radius:12px;text-align:center}
input[type=number]{font:inherit;width:90px;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;padding:13px;border-radius:14px;border:0;background:var(--acc);color:var(--accink);cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.badge{display:inline-block;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--mute)}
.q{font-size:20px;font-weight:700;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:right;font:inherit;padding:12px 14px;margin-bottom:9px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.ok{background:var(--okbg);border-color:var(--ok);font-weight:600}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
textarea{width:100%;min-height:110px;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.box{border-radius:12px;padding:10px 14px;margin:10px 0;border:1.5px solid var(--line)}
.box small{display:block;color:var(--mute)}
.box.right{background:var(--okbg);border-color:var(--ok)}
.row{display:flex;gap:10px;margin-top:10px}
.row .btn{font-size:15px}
.btn.yes{background:var(--ok);color:#fff}.btn.no{background:var(--bad);color:#fff}
.btn.dim{opacity:.35}
.big{font-size:56px;font-weight:800;text-align:center;margin:6px 0;color:var(--acc)}
.center{text-align:center}
.rev{border-top:1px solid var(--line);padding:10px 0}
.rev b{color:var(--ok)}
.hide{display:none}
.dm{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.shx{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.shx h2{margin:0 0 4px;font-size:17px;text-align:center}
.toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:300;max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;text-align:center;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tm{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:700}
.tbar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--acc);transition:width 1s linear}
.tm.low{color:var(--bad)}.tm.low .tbar i{background:var(--bad)}
.sol{background:var(--okbg);border:1px solid var(--ok);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px;font-weight:400;line-height:1.7;color:var(--ink);text-align:right;width:100%}
input.ans{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.box.wrong{background:var(--badbg);border-color:var(--bad)}
.chk{display:block;margin-top:12px;cursor:pointer}
.pmsg{min-height:52px;margin:6px 0 14px;color:var(--mute);font-weight:600}
.ov{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ovb{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.ovb .btn{font-size:14px;padding:9px}
.ov iframe{flex:1;width:100%;border:0;background:#fff}
.note{background:var(--badbg);border:1px solid var(--bad);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px;font-weight:400;line-height:1.7;color:var(--ink);text-align:right}
.back{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20;display:flex;align-items:center;justify-content:center;width:42px;height:42px;margin:0 0 10px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.sg{grid-template-columns:1fr}}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sc .qq{font-weight:700}
.sc .a{display:none;color:var(--ok);font-weight:800;border-top:1px dashed var(--line);padding-top:8px;width:100%}
.sc.open .a{display:block}.sc.open .tap{display:none}
.sc .tap{color:var(--mute)}
.sc.one{min-height:200px;margin-bottom:12px}
.sc.one .q{margin:6px 0}
.sc.one .a{font-size:20px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:6px 16px 26px;direction:ltr}
footer span{direction:rtl;unicode-bidi:isolate}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.win{font-size:22px;font-weight:800;color:var(--ok);margin:4px 0 8px;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA={"cats": {"1": "رياضة", "2": "تاريخ", "3": "جغرافيا", "4": "أدب", "5": "معلومات عامة", "6": "تكنولوجيا", "7": "علوم", "8": "مسرح وسينما", "9": "فن وحضارة", "10": "ألغاز"}, "qs": [{"q": "من هو أول لاعب فاز بكأس العالم كلاعب ومدرب؟", "a": "ماريو زاغالو", "c": 1, "d": ["بيليه", "دييغو مارادونا", "يوهان كرويف"]}, {"q": "من هو الملك الفرعوني الذي يعتبره المؤرخون صاحب أول معاهدة سلام مكتوبة في التاريخ مع الحيثيين؟", "a": "رمسيس الثاني", "c": 2, "d": ["تحتمس الثالث", "أمنحتب الثالث", "سيتي الأول"]}, {"q": "ما هي أكبر جزيرة في العالم ليست قارة؟", "a": "جرينلاند", "c": 3, "d": ["مدغشقر", "بورنيو", "غينيا الجديدة"]}, {"q": "من هو شاعر النيل؟", "a": "حافظ إبراهيم", "c": 4, "d": ["أحمد شوقي", "خليل مطران", "محمود سامي البارودي"]}, {"q": "ما أكبر نهر في العالم من حيث حجم المياه؟", "a": "نهر الأمازون", "c": 5, "d": ["نهر النيل", "نهر الكونغو", "نهر المسيسيبي"]}, {"q": "ما اسم الشركة المطورة لنظام أندرويد؟", "a": "Google", "c": 6, "d": ["Microsoft", "Apple", "Samsung"]}, {"q": "ما هي الوحدة المستخدمة في قياس المقاومة الكهربائية؟", "a": "الأوم", "c": 7, "d": ["الفولت", "الأمبير", "الواط"]}, {"q": "ما اسم المسرحية الكوميدية المصرية التي جسد فيها محمد صبحي شخصية «حافظ مظهر»؟", "a": "وجهة نظر", "c": 8, "d": ["الواد سيد الشغال", "مدرسة المشاغبين", "تخاريف"]}, {"q": "من هو الفنان الإيطالي صاحب لوحة «العشاء الأخير»؟", "a": "ليوناردو دافنشي", "c": 9, "d": ["ميكيلانجيلو", "رافائيل", "سلفادور دالي"]}, {"q": "والد أحمد لديه ثلاثة أبناء: الأول رعد والثاني برق، فما اسم الابن الثالث؟", "a": "أحمد", "c": 10, "d": ["محمود", "علي", "عمر"]}, {"q": "ما أول منتخب أوروبي فاز بكأس العالم خارج أوروبا؟", "a": "إسبانيا", "c": 1, "d": ["ألمانيا", "البرازيل", "إيطاليا"]}, {"q": "ما هي عاصمة الدولة المصرية القديمة خلال عصر الانتقال الأول والأسرتين التاسعة والعاشرة؟", "a": "إهناسيا", "c": 2, "d": ["طيبة", "منف", "أواريس"]}, {"q": "ما هو أطول نهر في قارة أوروبا؟", "a": "نهر الفولجا", "c": 3, "d": ["نهر الدانوب", "نهر الراين", "نهر الدنيبر"]}, {"q": "من هو أمير الشعراء؟", "a": "أحمد شوقي", "c": 4, "d const SEEN_KEY='qz_seen_math_v1';
function loadSeen(){try{return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||'[]'))}catch(e){return new Set()}}
function saveSeen(s){try{localStorage.setItem(SEEN_KEY,JSON.stringify([...s].slice(-6000)))}catch(e){}}
function genMath(n,lv){
  const seen=loadSeen(),out=[];
  for(let i=0;i<n;i++){
    const L=lv==='mix'?R.p(['easy','mid','hard']):lv;let q,t=0;
    do{q=R.p(GEN[L])()}while(seen.has(q.q)&&++t<80);
    seen.add(q.q);q.c=11;q.math=true;q.lvl=LV[L];q.id=0;out.push(q);
  }
  saveSeen(seen);return out;
}
function nrm(s){return String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/[,،\s]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064b-\u065f]/g,'').toLowerCase()}
function same(mine,q){const a=nrm(mine),b=nrm(q.a);if(!a)return false;if(q.num)return /^-?\d+(\.\d+)?$/.test(a)&&Math.abs(parseFloat(a)-parseFloat(b))<1e-9;return a===b}

  buildSheet.txt=txt;
  const css='@page{size:A4;margin:12mm}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{font-family:Tahoma,Arial,sans-serif;color:#111;margin:0;padding:18px;line-height:1.8;font-size:15px;background:#fff}h1{margin:0 0 4px;font-size:24px;color:#2f5bea}.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:#444;font-size:13px;border-bottom:2px solid #2f5bea;padding-bottom:8px;margin-bottom:10px}.who{display:flex;gap:20px;margin:8px 0 12px;font-size:14px}.who span{flex:1;border-bottom:1.5px solid #888;padding-bottom:2px}.q{border:1px solid #cfd4e0;border-radius:8px;padding:8px 12px;margin:8px 0;break-inside:avoid;page-break-inside:avoid}.qt{font-weight:700}.n{display:inline-block;min-width:26px;height:26px;border-radius:50%;background:#2f5bea;color:#fff;text-align:center;line-height:26px;margin-left:8px;font-size:13px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:6px}.o .b{display:inline-block;width:22px;height:22px;border:1.5px solid #555;border-radius:50%;text-align:center;line-height:19px;margin-left:6px;font-size:12px}.ln{border-bottom:1.5px dotted #888;height:26px}.ans{margin-top:6px;color:#0b7a46;font-weight:700}.nt{margin-top:4px;font-size:13px;background:#eef2ff;border-radius:6px;padding:4px 8px}.nt.w{background:#fdeaea}.key{break-before:page;page-break-before:always}.key h2{color:#2f5bea}.kg{columns:2;column-gap:20px;font-size:14px}.kg div{break-inside:avoid;padding:3px 0;border-bottom:1px dashed #ccc}small{color:#666;display:block;font-size:11px}';
  return '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تحدي المعلومات - '+(exam?'ورقة أسئلة':'ورقة مذاكرة')+'</title><style>'+css+'</style></head><body><h1>🧠 تحدي المعلومات — '+(exam?'ورقة أسئلة':'ورقة مذاكرة')+'</h1><div class="meta"><span>المجال: '+esc(fld)+'</span><span>عدد الأسئلة: '+L.length+'</span><span>التاريخ: '+new Date().toLocaleDateString('ar-EG')+'</span></div>'+(exam?'<div class="who"><span>الاسم:</span><span>الدرجة: &nbsp;&nbsp;&nbsp;/ '+L.length+'</span></div>':'')+body+key+'</body></html>';
}
function printFlow(L){
  stopTimer();clear();
  app.append(backBtn(),el('h1',0,'🖨️ طباعة الأسئلة'),el('p','sub',L.length+' سؤال — اختار نوع الورقة'));
  let kind='exam',key=true;
  const s=el('div','sec');s.append(el('h2',0,'نوع الورقة'));
  chips(s,[{label:'📝 ورقة امتحان',v:'exam'},{label:'📖 ورقة مذاكرة (بالإجابات)',v:'study'}],i=>kind===i.v,i=>{kind=i.v;kr.style.display=kind==='exam'?'':'none'});
  const kr=el('label','chk');const cb=el('input');cb.type='checkbox';cb.checked=true;cb.onchange=()=>{key=cb.checked};kr.append(cb,' إضافة نموذج الإجابة في آخر الورقة');s.append(kr);
  app.append(s);
  const go=el('button','btn','يلا جهّز الملف 🚀');go.onclick=()=>printLoad(L,kind,key);app.append(go);
}
function printLoad(L,kind,key){
  clear();
  const w=el('div','sec center');
  const em=el('div','big','🖨️');em.style.fontSize='64px';
  const msg=el('div','pmsg'),bar=el('div','bar'),fill=el('i');bar.append(fill);
  w.append(em,el('h2',0,'جاري تجهيز الملف...'),msg,bar);app.append(w);
  const msgs=['روح شوف مصالحك لغاية ما الملف يجهز 😂','بنرتب الأسئلة واحد واحد... متقلقش 📚','الطابعة بتشرب قهوتها وجاية ☕','بندوّر على الحبر... لقيناه تحت الكنبة 🛋️','بنصحّي الأسئلة من النوم 😴','بنكوي الورق ونظبط الهوامش 🧺','لسه بنراجع الإملاء... الدنيا مش سايبة ✍️','قربنا! متشدش في الصفحة 🙈','الملف بيلبس أحلى ما عنده عشان يقابلك 🤵'];
  let k=0;msg.textContent=msgs[0];
  const total=3800+Math.min(L.length,200)*8,t0=Date.now();
  const html=buildSheet(L,kind,key),txt=buildSheet.txt;
  const mt=setInterval(()=>{k=(k+1)%msgs.length;msg.textContent=msgs[k]},1400);
  const tick=setInterval(()=>{
    const p=Math.min(100,(Date.now()-t0)/total*100);fill.style.width=p+'%';
    if(p>=100){clearInterval(tick);clearInterval(mt);ready()}
  },80);
  function ready(){
    clear();app.append(backBtn());
    const s=el('div','sec center');
    s.append(el('div','big','✅'),el('h2',0,'الملف جاهز يا باشا! 🎉'),el('div','sub','استعرضه واطبعه، أو نزّله على جهازك'));
    const pv=el('button','btn','👁️ استعراض');pv.style.marginTop='12px';pv.onclick=()=>preview(html,txt);
    const dl=el('button','btn ghost','⬇️ تنزيل PDF');dl.style.marginTop='10px';dl.onclick=()=>downloadMenu(html,txt);
    s.append(pv,dl);app.append(s);
  }
}
function toast(t){const d=el('div','toast',t);document.body.append(d);setTimeout(()=>d.remove(),7000)}
function printHTML(html,hint){
  const fr=document.createElement('iframe');
  fr.style.cssText='position:fixed;left:-9999px;top:0;width:210mm;height:297mm;border:0';
  fr.onload=()=>{setTimeout(()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){window.print()}setTimeout(()=>fr.remove(),120000)},500)};
  fr.srcdoc=html;document.body.append(fr);
  if(hint)toast('📄 في نافذة الطباعة اختار «حفظ كـ PDF» (Save as PDF) وبعدها دوس حفظ');
}
function saveFile(name,content,mime){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+content],{type:mime+';charset=utf-8'}));
  a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);
}
function downloadMenu(html,txt){
  const ov=el('div','dm'),sh_=el('div','shx');
  sh_.append(el('h2',0,'اختار صيغة الملف'));
  const mk=(label,fn,ghost)=>{const b=el('button','btn'+(ghost?' ghost':''),label);b.onclick=()=>{ov.remove();fn()};sh_.append(b)};
  mk('📄 PDF (احفظه من نافذة الطباعة)',()=>printHTML(html,true));
  mk('📝 Word (‎.doc‎)',()=>saveFile('tahadi-questions.doc',html.replace('<html lang="ar" dir="rtl">','<html lang="ar" dir="rtl" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'),'application/msword'),true);
  mk('🌐 صفحة ويب (‎.html‎)',()=>saveFile('tahadi-questions.html',html,'text/html'),true);
  mk('🔤 ملف نصي (‎.txt‎)',()=>saveFile('tahadi-questions.txt',txt,'text/plain'),true);
  const c=el('button','btn ghost','إلغاء');c.onclick=()=>ov.remove();sh_.append(c);
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  ov.append(sh_);document.body.append(ov);
}
function download(html){printHTML(html,true)}
function preview(html,txt){
  const ov=el('div','ov'),bar=el('div','ovb');
  const pb=el('button','btn','🖨️ طباعة'),db=el('button','btn ghost','⬇️ تنزيل PDF'),cb=el('button','btn ghost','✕ إغلاق');
  const fr=document.createElement('iframe');fr.srcdoc=html;
  pb.onclick=()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){window.print()}};
  db.onclick=()=>downloadMenu(html,txt);cb.onclick=()=>ov.remove();
  bar.append(pb,db,cb);ov.append(bar,fr);document.body.append(ov);
}

function ansEl(q){const d=el('div','a',q.a);if(q.sol)d.append(el('div','sol','💡 الحل: '+q.sol));if(q.note)d.append(el('div','note','⚠️ '+q.note));return d}
function noteEl(q){return el('div','note','⚠️ '+q.note)}
function backBtn(ask){
  const b=el('button','back','→');b.setAttribute('aria-label','رجوع');
  b.onclick=()=>{if(ask&&!confirm('تخرج من الاختبار وترجع للإعدادات؟'))return;setup()};
  return b;
}
function startExam(L){
  quiz=sh(L).map(q=>({q,t:cfg.mode==='mix'?(Math.random()<.5?'mcq':'txt'):cfg.mode}));
  idx=0;score={mcq:[0,0],txt:[0,0]};missed=[];show();
}
function study(L,style){
  clear();
  const all=L.length>=QS.length;
  app.append(backBtn(),el('h1',0,'📖 مذاكرة'),el('p','sub',L.length+' سؤال'+(all?' — كل الأسئلة':'')+' — دول نفس الأسئلة اللي هتتسأل فيها'));
  const s=el('div','sec');s.append(el('h2',0,'طريقة العرض'));
  chips(s,[{label:'🃏 بطاقات',v:'cards'},{label:'📜 قائمة',v:'list'},{label:'👆 بطاقة بطاقة',v:'one'}],i=>style===i.v,i=>{style=i.v;draw()});
  app.append(s);
  const box=el('div');app.append(box);
  const badge=q=>el('span','badge',ICON[q.c]+' '+CATS[q.c]+(q.id?' · #'+q.id:(q.lvl?' · '+q.lvl:'')));
  let cur=0;
  function draw(){
    box.replaceChildren();
    if(style==='cards'){
      const tg=el('button','btn ghost','إظهار كل الإجابات');tg.style.marginBottom='12px';
      let on=false;
      const g=el('div','sg');
      const cs=L.map(q=>{const c=el('div','sc');c.append(badge(q),el('div','qq',q.q),ansEl(q),el('small','tap','اضغط لإظهار الإجابة'));c.onclick=()=>c.classList.toggle('open');g.append(c);return c});
      tg.onclick=()=>{on=!on;cs.forEach(c=>c.classList.toggle('open',on));tg.textContent=on?'إخفاء كل الإجابات':'إظهار كل الإجابات'};
      box.append(tg,g);
    }else if(style==='list'){
      L.forEach((q,i)=>{const d=el('div','sec');d.append(badge(q),el('div','q',(i+1)+'. '+q.q),el('div','box right',q.a));if(q.sol)d.append(el('div','sol','💡 الحل: '+q.sol));if(q.note)d.append(noteEl(q));box.append(d)});
    }else{
      const c=el('div','sec sc one');
      const nav=el('div','row');
      const pv=el('button','btn ghost','→ السابق'),nx=el('button','btn','التالي ←');
      nav.append(pv,nx);
      const render=()=>{
        const q=L[cur];c.className='sec sc one';c.replaceChildren(el('div','top',(cur+1)+' من '+L.length),badge(q),el('div','q',q.q),ansEl(q),el('small','tap','اضغط على البطاقة لإظهار الإجابة'));
        pv.disabled=cur===0;nx.disabled=cur===L.length-1;
      };
      c.onclick=()=>c.classList.toggle('open');
      pv.onclick=()=>{cur--;render()};nx.onclick=()=>{cur++;render()};
      render();box.append(c,nav);
    }
  }
  draw();
  const go=el('button','btn','✅ خلصت مذاكرة، ابدأ الاختبار');go.style.marginTop='18px';go.onclick=()=>startExam(L);
  app.append(go);
}
function header(){
  const it=quiz[idx];
  const t=el('div','top');t.append(el('span',0,'سؤال '+(idx+1)+' من '+quiz.length),el('span','badge',ICON[it.q.c]+' '+CATS[it.q.c]+(it.q.lvl?' · '+it.q.lvl:'')));
  const b=el('div','bar'),i=el('i');i.style.width=(idx/quiz.length*100)+'%';b.append(i);
  app.append(backBtn(true),t,b);
}
function nextBtn(){
  const b=el('button','btn',idx+1<quiz.length?'السؤال التالي ←':'شوف النتيجة');
  b.style.marginTop='14px';b.onclick=()=>{idx++;idx<quiz.length?show():result()};app.append(b);
}
let tmr=null;
function stopTimer(){clearInterval(tmr);tmr=null}
function show(){
  stopTimer();clear();header();
  const it=quiz[idx],q=it.q;
  const card=el('div','sec');
  let left=60,onTimeout=null;
  if(q.math){
    const tm=el('div','tm'),tt=el('span',0,'⏱️ 60'),bw=el('div','tbar'),bar=el('i');bw.append(bar);tm.append(tt,bw);app.append(tm);
    const upd=()=>{tt.textContent='⏱️ '+left;bar.style.width=(left/60*100)+'%';tm.classList.toggle('low',left<=10)};
    upd();
    tmr=setInterval(()=>{left--;upd();if(left<=0){stopTimer();if(onTimeout)onTimeout()}},1000);
  }
  card.append(el('div','q',q.q));app.append(card);
  const extra=()=>{if(q.sol)card.append(el('div','sol','💡 الحل: '+q.sol));if(q.note)card.append(noteEl(q))};
  if(it.t==='mcq'){
    const opts=sh([q.a,...sh(q.d).slice(0,3)]);
    const btns=opts.map(o=>{const b=el('button','opt',o);card.append(b);return b});
    let done=false;
    const finish=pb=>{
      if(done)return;done=true;stopTimer();
      btns.forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('ok')});
      score.mcq[1]++;
      if(pb&&pb.textContent===q.a)score.mcq[0]++;
      else{if(pb)pb.classList.add('bad');else card.append(el('div','box','⏰ انتهى الوقت'));missed.push(q)}
      extra();nextBtn();
    };
    btns.forEach(b=>b.onclick=()=>finish(b));
    onTimeout=()=>finish(null);
  }else if(q.math){
    const inp=el('input','ans');inp.type='text';inp.setAttribute('inputmode',q.num?'decimal':'text');inp.placeholder='اكتب إجابتك...';card.append(inp);
    const ok=el('button','btn','تأكيد الإجابة');ok.style.marginTop='12px';card.append(ok);
    let done=false;
    const finish=timeout=>{
      if(done)return;done=true;stopTimer();
      const mine=inp.value.trim();inp.disabled=true;ok.remove();
      const good=!timeout&&same(mine,q);
      score.txt[1]++;if(good)score.txt[0]++;else missed.push(q);
      const r=el('div','box '+(good?'right':'wrong'));
      r.append(el('small',0,timeout?'⏰ انتهى الوقت':good?'✓ إجابة صحيحة':'✗ إجابتك: '+(mine||'—')));
      if(!good)r.append(el('b',0,'الإجابة الصحيحة: '+q.a));
      card.append(r);extra();nextBtn();
    };
    ok.onclick=()=>finish(false);
    inp.onkeydown=e=>{if(e.key==='Enter')finish(false)};
    onTimeout=()=>finish(true);
    setTimeout(()=>inp.focus(),50);
  }else{
    const ta=el('textarea');ta.placeholder='اكتب إجابتك هنا...';card.append(ta);
    const rv=el('button','btn','أظهر الإجابة الصحيحة');rv.style.marginTop='12px';rv.disabled=true;card.append(rv);
    ta.oninput=()=>{rv.disabled=!ta.value.trim()};
    rv.onclick=()=>{
      const mine=ta.value.trim();
      ta.replaceWith(el('div','box'));
      const mb=card.querySelector('.box');mb.append(el('small',0,'إجابتك'),el('span',0,mine));
      rv.remove();
      const cb=el('div','box right');cb.append(el('small',0,'الإجابة الصحيحة'),el('b',0,q.a));card.append(cb);
      if(q.note)card.append(noteEl(q));
      card.append(el('div',0,'إجابتك كانت:'));
      const row=el('div','row'),y=el('button','btn yes','✓ إجابتي صحيحة'),n=el('button','btn no','✗ إجابتي خطأ');
      row.append(y,n);card.append(row);
      const pick=ok=>{
        y.disabled=n.disabled=true;(ok?n:y).classList.add('dim');
        score.txt[1]++;if(ok)score.txt[0]++;else missed.push(q);
        nextBtn();
      };
      y.onclick=()=>pick(true);n.onclick=()=>pick(false);
    };
  }
}
function celebrate(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas');cv.id='fx';document.body.append(cv);
  const x=cv.getContext('2d');const W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cols=['#f94144','#f8961e','#f9c74f','#90be6d','#43aa8b','#4d908e','#577590','#9b5de5'];
  const ps=Array.from({length:150},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,w:6+Math.random()*7,h:8+Math.random()*10,vx:-1.5+Math.random()*3,vy:2+Math.random()*4,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(t){
    const el=t-t0;x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vy+=.03;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=Math.max(0,Math.min(1,(5500-el)/1200));x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(el<5500)requestAnimationFrame(f);else cv.remove();
  })(t0);
}
function result(){
  stopTimer();clear();
  const c=score.mcq[0]+score.txt[0],t=score.mcq[1]+score.txt[1],p=Math.round(c/t*100);
  app.append(backBtn());
  const s=el('div','sec center');
  const win=p>=50;
  s.append(el('h2',0,'نتيجتك'),...(win?[el('div','win','🎉 مبروك! نجحت 🎉')]:[]),el('div','big',c+' / '+t),el('div',0,p+'٪ — '+(p>=80?'ممتاز! 🔥':p>=50?'كويس، كمّل! 👍':'حاول تاني، هتبقى أحسن 💪')));
  if(score.mcq[1])s.append(el('div','sub','اختياري: '+score.mcq[0]+' / '+score.mcq[1]));
  if(score.txt[1])s.append(el('div','sub','كتابة: '+score.txt[0]+' / '+score.txt[1]));
  app.append(s);
  if(win)celebrate();
  if(missed.length){
    const r=el('div','sec');r.append(el('h2',0,'أسئلة محتاجة مراجعة'));
    missed.forEach(q=>{const d=el('div','rev');d.append(el('div',0,q.q),el('b',0,q.a));if(q.sol)d.append(el('div','sol','💡 الحل: '+q.sol));if(q.note)d.append(noteEl(q));r.append(d)});
    app.append(r);
  }
  const a=el('button','btn','🔁 تحدي جديد');a.onclick=setup;app.append(a);
}
setup();
</script>
</body>
