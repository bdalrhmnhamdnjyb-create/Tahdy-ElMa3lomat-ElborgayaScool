<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5bea">
<meta name="description" content="تحدي المعلومات: ٥٠٠ سؤال في ١٠ مجالات">
<title>تحدي المعلومات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#6b7385;--line:#e3dfd4;--acc:#2f5bea;--accink:#fff;--ok:#1f9d63;--okbg:#e2f6ec;--bad:#d64545;--badbg:#fde8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151c;--card:#1b202b;--ink:#eef0f6;--mute:#9aa2b5;--line:#2c3342;--acc:#6f8cff;--accink:#0e1220;--ok:#4cc790;--okbg:#17332a;--bad:#ff7a7a;--badbg:#3a1f22}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151c;--card:#1b202b;--ink:#eef0f6;--mute:#9aa2b5;--line:#2c3342;--acc:#6f8cff;--accink:#0e1220;--ok:#4cc790;--okbg:#17332a;--bad:#ff7a7a;--badbg:#3a1f22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,Tahoma,sans-serif;line-height:1.7;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:26px;margin:6px 0 2px;font-weight:800}
.sub{color:var(--mute);margin:0 0 18px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.sec h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .chip{border-radius:12px;text-align:center}
input[type=number]{font:inherit;width:90px;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;padding:13px;border-radius:14px;border:0;background:var(--acc);color:var(--accink);cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.badge{display:inline-block;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--mute)}
.q{font-size:20px;font-weight:700;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:right;font:inherit;padding:12px 14px;margin-bottom:9px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.ok{background:var(--okbg);border-color:var(--ok);font-weight:600}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
textarea{width:100%;min-height:110px;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.box{border-radius:12px;padding:10px 14px;margin:10px 0;border:1.5px solid var(--line)}
.box small{display:block;color:var(--mute)}
.box.right{background:var(--okbg);border-color:var(--ok)}
.row{display:flex;gap:10px;margin-top:10px}
.row .btn{font-size:15px}
.btn.yes{background:var(--ok);color:#fff}.btn.no{background:var(--bad);color:#fff}
.btn.dim{opacity:.35}
.big{font-size:56px;font-weight:800;text-align:center;margin:6px 0;color:var(--acc)}
.center{text-align:center}
.rev{border-top:1px solid var(--line);padding:10px 0}
.rev b{color:var(--ok)}
.hide{display:none}
.adminlink{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.adm{position:fixed;inset:0;z-index:500;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
.admbox{margin:auto;width:100%;max-width:380px;padding:20px;display:flex;flex-direction:column;gap:10px}
.admbox h2{margin:0 0 6px;text-align:center}
.admtop{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.admtop .btn{width:auto;padding:8px 12px;font-size:14px;margin:0}
.admtop b{flex:1;min-width:120px}
.admbody{flex:1;overflow:auto;padding:12px;max-width:640px;width:100%;margin:0 auto}
.admbar{margin-bottom:10px}
.ain{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.admf{display:block;margin-bottom:10px}.admf span{display:block;color:var(--mute);font-size:13px;margin-bottom:3px}
.admrow{display:block;width:100%;text-align:right;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.admrow.mod{border-color:var(--acc);background:var(--bg)}
.admrow small{display:block;color:var(--ok);margin-top:2px}
.amsg{min-height:20px;font-size:14px;color:var(--bad);margin-top:6px}.amsg.ok{color:var(--ok)}
.admgh{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.admgh h2{font-size:15px;margin:0}
.shx{max-height:92vh;overflow:auto}
.dm{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.shx{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.shx h2{margin:0 0 4px;font-size:17px;text-align:center}
.toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:700;max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;text-align:center;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tm{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:700}
.tbar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--acc);transition:width 1s linear}
.tm.low{color:var(--bad)}.tm.low .tbar i{background:var(--bad)}
.sol{background:var(--okbg);border:1px solid var(--ok);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px;font-weight:400;line-height:1.7;color:var(--ink);text-align:right;width:100%}
input.ans{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.box.wrong{background:var(--badbg);border-color:var(--bad)}
.chk{display:block;margin-top:12px;cursor:pointer}
.pmsg{min-height:52px;margin:6px 0 14px;color:var(--mute);font-weight:600}
.ov{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ovb{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.ovb .btn{font-size:14px;padding:9px}
.ov iframe{flex:1;width:100%;border:0;background:#fff}
.note{background:var(--badbg);border:1px solid var(--bad);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px;font-weight:400;line-height:1.7;color:var(--ink);text-align:right}
.back{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20;display:flex;align-items:center;justify-content:center;width:42px;height:42px;margin:0 0 10px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.sg{grid-template-columns:1fr}}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sc .qq{font-weight:700}
.sc .a{display:none;color:var(--ok);font-weight:800;border-top:1px dashed var(--line);padding-top:8px;width:100%}
.sc.open .a{display:block}.sc.open .tap{display:none}
.sc .tap{color:var(--mute)}
.sc.one{min-height:200px;margin-bottom:12px}
.sc.one .q{margin:6px 0}
.sc.one .a{font-size:20px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:6px 16px 26px;direction:ltr}
footer span{direction:rtl;unicode-bidi:isolate}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.win{font-size:22px;font-weight:800;color:var(--ok);margin:4px 0 8px;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA={"cats": {"1": "رياضة", "2": "تاريخ", "3": "جغرافيا", "4": "أدب", "5": "معلومات عامة", "6": "تكنولوجيا", "7": "علوم", "8": "سينما ومسرح", "9": "لوحات ومعالم", "10": "سرعة بديهة", "11": "أغاني وموسيقى"}, "qs": [{"q": "من هو أول لاعب فاز بكأس العالم كلاعب ومدرب؟", "a": "ماريو زاغالو", "c": 1, "n": 1, "d": ["بيليه", "دييغو مارادونا", "يوهان كرويف"]}, {"q": "ما أول منتخب أوروبي فاز بكأس العالم خارج أوروبا؟", "a": "إسبانيا", "c": 1, "n": 2, "d": ["ألمانيا", "البرازيل", "إيطاليا"]}, {"q": "من سجل أول هدف ذهبي في تاريخ كأس العالم؟", "a": "لوران بلان", "c": 1, "n": 3, "d": ["زين الدين زيدان", "ميشيل بلاتيني", "ديفيد ترزيغيه"]}, {"q": "ما المنتخب الذي خاض أكبر عدد من المباريات في كأس العالم دون تحقيق اللقب؟", "a": "المكسيك", "c": 1, "n": 4, "d": ["الولايات المتحدة", "بلجيكا", "سويسرا"]}, {"q": "من أصغر لاعب سجل في نهائي كأس العالم؟", "a": "بيليه", "c": 1, "n": 5, "d": ["ليونيل ميسي", "كيليان مبابي", "غارينشا"]}, {"q": "من أكبر لاعب سنًا سجل هدفًا في كأس العالم؟", "a": "روجيه ميلا", "c": 1, "n": 6, "d": ["باولو روسي", "بيليه", "ميروسلاف كلوزه"]}, {"q": "ما أول نادٍ حقق الثلاثية الأوروبية مرتين؟", "a": "برشلونة", "c": 1, "n": 7, "d": ["ريال مدريد", "بايرن ميونخ", "إنتر ميلان"]}, {"q": "من اللاعب الذي سجل في نهائي دوري الأبطال مع ثلاثة أندية مختلفة؟", "a": "كلارنس سيدورف", "c": 1, "n": 8, "d": ["كريستيانو رونالدو", "أندريا بيرلو", "باتريس إيفرا"]}, {"q": "ما المنتخب الذي حقق أطول سلسلة مباريات دون هزيمة دوليًا؟", "a": "إيطاليا", "c": 1, "n": 9, "d": ["البرازيل", "إسبانيا", "الأرجنتين"]}, {"q": "من أول حارس مرمى فاز بالكرة الذهبية؟", "a": "ليف ياشين", "c": 1, "n": 10, "d": ["جيانلويجي بوفون", "إيكر كاسياس", "مانويل نوير"]}, {"q": "ما الدولة التي استضافت أول دورة ألعاب أولمبية حديثة؟", "a": "اليونان", "c": 1, "n": 11, "d": ["فرنسا", "إيطاليا", "الولايات المتحدة"]}, {"q": "من صاحب الرقم القياسي العالمي في الوثب العالي للرجال؟", "a": "خافيير سوتومايور", "c": 1, "n": 12, "d": ["ستيفان هولم", "معتز برشم", "بوغدان بوندارينكو"]}, {"q": "كم يبلغ الرقم القياسي العالمي للوثب ال const SEEN_KEY='qz_seen_math_v1';
function loadSeen(){try{return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||'[]'))}catch(e){return new Set()}}
function saveSeen(s){try{localStorage.setItem(SEEN_KEY,JSON.stringify([...s].slice(-6000)))}catch(e){}}
function genMath(n,lv){
  const seen=loadSeen(),out=[];
  for(let i=0;i<n;i++){
    const L=lv==='mix'?R.p(['easy','mid','hard']):lv;let q,t=0;
    do{q=R.p(GEN[L])()}while(seen.has(q.q)&&++t<80);
    seen.add(q.q);q.c=12;q.math=true;q.lvl=LV[L];q.id=0;out.push(q);
  }
  saveSeen(seen);return out;
}
function nrm(s){return String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/[,،\s]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064b-\u065f]/g,'').toLowerCase()}
function same(mine,q){const a=nrm(mine),b=nrm(q.a);if(!a)return false;if(q.num)return /^-?\d+(\.\d+)?$/.test(a)&&Math.abs(parseFloat(a)-parseFloat(b))<1e-9;return a===b}

  admClose();
  const ov=el('div','adm');document.body.append(ov);
  admOK?admEditor(ov):admLogin(ov);
}
function admLogin(ov){
  ov.replaceChildren();
  const box=el('div','admbox');
  box.append(el('h2',0,'🔐 دخول الأدمن'));
  const u=el('input','ain');u.placeholder='اسم المستخدم';u.autocomplete='username';u.setAttribute('autocapitalize','off');
  const p=el('input','ain');p.type='password';p.placeholder='كلمة المرور';p.autocomplete='current-password';
  const msg=el('div','amsg');
  const go=el('button','btn','دخول'),cl=el('button','btn ghost','إغلاق');cl.style.marginTop='8px';
  const run=async()=>{
    msg.textContent='';
    if(Date.now()<admLock){msg.textContent='محاولات كتير غلط. استنى '+Math.ceil((admLock-Date.now())/1000)+' ثانية.';return}
    if(!(window.crypto&&crypto.subtle)){msg.textContent='المتصفح ده مش بيدعم التشفير المطلوب. افتح الموقع من رابط https.';return}
    go.disabled=true;go.textContent='جاري التحقق...';
    let ok=false;try{ok=(await admHash(u.value,p.value))===ADM.h}catch(e){}
    go.disabled=false;go.textContent='دخول';
    if(ok){admOK=true;admFail=0;admEditor(ov)}
    else{admFail++;if(admFail>=5){admLock=Date.now()+60000;admFail=0}msg.textContent='اسم المستخدم أو كلمة المرور غلط'}
  };
  go.onclick=run;p.onkeydown=e=>{if(e.key==='Enter')run()};cl.onclick=admClose;
  box.append(u,p,go,cl,msg);ov.append(box);setTimeout(()=>u.focus(),50);
}
function admEditor(ov){
  ov.replaceChildren();
  const top=el('div','admtop');
  const mc=el('span','badge','');
  const pub=el('button','btn','🚀 نشر'),lo=el('button','btn ghost','خروج'),cl=el('button','btn ghost','✕');
  top.append(el('b',0,'✏️ لوحة التعديل'),mc,pub,lo,cl);
  pub.onclick=admPublish;
  lo.onclick=()=>{admOK=false;admLogin(ov)};cl.onclick=admClose;
  const sbar=el('div','admbar');
  const s=el('input','ain');s.placeholder='ابحث برقم السؤال أو بنص من السؤال/الإجابة';s.value=admFilter;
  sbar.append(s);
  const list=el('div','admlist');
  const body=el('div','admbody');body.append(sbar,list);
  ov.append(top,body);
  const render=()=>{
    mc.textContent='معدَّل: '+modCount();
    const f=s.value.trim();admFilter=f;
    let arr=QS;
    if(/^\d+$/.test(f))arr=QS.filter(q=>String(q.n)===f);
    else if(f){const n=nrm(f);arr=QS.filter(q=>nrm(q.q).includes(n)||nrm(q.a).includes(n))}
    list.replaceChildren();
    arr.slice(0,admLimit).forEach(q=>{
      const r=el('button','admrow'+(isMod(q)?' mod':''));
      r.append(el('b',0,CATS[q.c]+' #'+q.n),el('span',0,' '+(isMod(q)?'✎ ':'')+q.q.slice(0,90)),el('small',0,'← '+q.a.slice(0,50)));
      r.onclick=()=>admEdit(ov,q.id);list.append(r);
    });
    if(arr.length>admLimit){const m=el('button','btn ghost','عرض المزيد ('+(arr.length-admLimit)+')');m.onclick=()=>{admLimit+=40;render()};list.append(m)}
    if(!arr.length)list.append(el('div','sub','مفيش نتائج'));
  };
  s.oninput=()=>{admLimit=40;render()};
  render();
}
function admEdit(ov,id){
  ov.replaceChildren();
  const q=QS[id-1];
  const top=el('div','admtop');top.append(el('b',0,'تعديل: '+CATS[QS[id-1].c]+' #'+QS[id-1].n));
  const back=el('button','btn ghost','↩ القائمة');back.onclick=()=>admEditor(ov);top.append(back);
  const body=el('div','admbody');
  const mk=(label,node)=>{const w=el('label','admf');w.append(el('span',0,label),node);body.append(w);return node};
  const tq=mk('السؤال',el('textarea','ain'));tq.value=q.q;tq.rows=3;
  const ia=mk('الإجابة الصحيحة',el('input','ain'));ia.value=q.a;
  const ds=[0,1,2].map(i=>{const x=mk('اختيار غلط '+(i+1),el('input','ain'));x.value=q.d[i]||'';return x});
  const tn=mk('الملاحظة (سيبها فاضية لو مفيش ملاحظة)',el('textarea','ain'));tn.value=(q.note||'').replace(/^ملاحظة:\s*/,'');tn.rows=4;
  const msg=el('div','amsg');
  const sv=el('button','btn','💾 حفظ التعديل'),rs=el('button','btn ghost','↺ رجوع للنسخة الأصلية');rs.style.marginTop='8px';
  sv.onclick=()=>{
    const a=ia.value.trim(),d=ds.map(x=>x.value.trim()),qq=tq.value.trim();
    if(!qq||!a){msg.textContent='السؤال والإجابة مطلوبين';return}
    if(d.some(x=>!x)||new Set([...d,a]).size!==4){msg.textContent='لازم 3 اختيارات غلط مختلفة ومش زي الإجابة الصحيحة';return}
    q.q=qq;q.a=a;q.d=d;
    const n=tn.value.trim();if(n)q.note='ملاحظة: '+n.replace(/^ملاحظة:\s*/,'');else delete q.note;
    saveLocal();msg.className='amsg ok';msg.textContent='✓ اتحفظ (محفوظ على الجهاز ده، دوس «نشر» من القائمة عشان يظهر للكل)';
  };
  rs.onclick=()=>{
    if(!confirm('ترجع السؤال ده للنسخة المنشورة؟'))return;
    const b=JSON.parse(BASE[id-1]);q.q=b.q;q.a=b.a;q.d=b.d;if(b.note)q.note=b.note;else delete q.note;saveLocal();admEdit(ov,id);
  };
  body.append(sv,rs,msg);ov.append(top,body);
}
function admPublish(){
  const ov=el('div','dm');const sh_=el('div','shx');
  sh_.append(el('h2',0,'🚀 نشر التعديلات'),el('div','sub','عدد الأسئلة المعدّلة: '+modCount()));
  const dl=el('button','btn ghost','⬇️ تنزيل index.html محدّث (ترفعه بنفسك)');
  const st=el('div','amsg');
  dl.onclick=async()=>{
    st.className='amsg';st.textContent='جاري التجهيز...';
    try{
      const r=await fetch(location.href.split('#')[0].split('?')[0],{cache:'no-store'});
      if(!r.ok)throw new Error('تعذر قراءة ملف الموقع ('+r.status+')');
      const out=injectData(await r.text(),admData());
      saveFile('index.html',out,'text/html',false);st.className='amsg ok';st.textContent='✓ اتنزّل index.html. ارفعه على GitHub/Netlify بنفس الاسم.';
    }catch(e){st.textContent='تعذر التنزيل: '+e.message+' (لو الموقع مفتوح من ملف على جهازك، جرّب النشر عبر GitHub أو افتح الموقع من رابطه)'}
  };
  const f=el('div','admgh');
  f.append(el('h2',0,'النشر المباشر على GitHub'));
  let saved={};try{saved=JSON.parse(localStorage.getItem('qz_admin_gh')||'{}')}catch(e){}
  const repo=el('input','ain');repo.placeholder='المستودع: اسم-المستخدم/اسم-الريبو';repo.value=saved.repo||'';
  const br=el('input','ain');br.placeholder='الفرع (main)';br.value=saved.br||'main';
  const pa=el('input','ain');pa.placeholder='مسار الملف (index.html)';pa.value=saved.pa||'index.html';
  const tk=el('input','ain');tk.type='password';tk.placeholder='GitHub Token (بيتمسح بعد النشر ومش بيتحفظ)';
  const go=el('button','btn','🚀 انشر دلوقتي');
  go.onclick=async()=>{
    st.className='amsg';
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo.value.trim())||!tk.value.trim()){st.textContent='اكتب المستودع بالشكل owner/repo وحط الـ Token';return}
    go.disabled=true;st.textContent='جاري النشر...';
    try{
      await ghPublish(repo.value.trim(),br.value.trim()||'main',pa.value.trim()||'index.html',tk.value.trim());
      try{localStorage.setItem('qz_admin_gh',JSON.stringify({repo:repo.value.trim(),br:br.value.trim(),pa:pa.value.trim()}))}catch(e){}
      tk.value='';st.className='amsg ok';st.textContent='✓ اتنشر! الموقع هيتحدّث خلال دقيقة أو اتنين (حدّث الصفحة بالقوة).';
    }catch(e){st.textContent='فشل النشر: '+e.message}
    go.disabled=false;
  };
  f.append(repo,br,pa,tk,go);
  const c=el('button','btn ghost','إغلاق');c.onclick=()=>ov.remove();
  sh_.append(dl,f,st,c);ov.append(sh_);document.body.append(ov);
}
async function ghPublish(repo,branch,path,token){
  const api='https://api.github.com/repos/'+repo+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
  const hdr={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'};
  let r=await fetch(api+'?ref='+encodeURIComponent(branch),{headers:hdr});
  if(r.status===401||r.status===403)throw new Error('الـ Token مش صالح أو مالوش صلاحية على المستودع ('+r.status+')');
  if(!r.ok)throw new Error('تعذر قراءة الملف من GitHub ('+r.status+')');
  const j=await r.json();let src;
  if(j.content&&j.encoding==='base64')src=b64ToUtf8(j.content.replace(/\s/g,''));
  else{const r2=await fetch(api+'?ref='+encodeURIComponent(branch),{headers:Object.assign({},hdr,{'Accept':'application/vnd.github.raw+json'})});if(!r2.ok)throw new Error('تعذر قراءة الملف ('+r2.status+')');src=await r2.text()}
  const out=injectData(src,admData());
  r=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdr),body:JSON.stringify({message:'تحديث الأسئلة من لوحة الأدمن',content:utf8ToB64(out),sha:j.sha,branch})});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error('فشل الرفع ('+r.status+') '+m)}
}
